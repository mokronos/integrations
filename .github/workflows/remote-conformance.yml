name: Remote conformance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: remote-conformance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Probe current remote integrations
        working-directory: packages/integrations
        env:
          INTEGRATIONS_TEST_GITHUB_TOKEN: ${{ secrets.REMOTE_MCP_GITHUB_TOKEN }}
          INTEGRATIONS_TEST_MCP_URL: ${{ vars.INTEGRATIONS_TEST_MCP_URL }}
        run: bun run test:remote
