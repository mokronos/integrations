name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ inputs.stage || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'staging' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Deploy ${{ inputs.stage || 'staging' }}
        working-directory: apps/host-cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INTEGRATIONS_GOOGLE_CLIENT_ID: ${{ vars.INTEGRATIONS_GOOGLE_CLIENT_ID }}
          INTEGRATIONS_GOOGLE_CLIENT_SECRET: ${{ secrets.INTEGRATIONS_GOOGLE_CLIENT_SECRET }}
        run: bun run deploy -- --stage ${{ inputs.stage || 'staging' }} --yes --no-input
