name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Verify coordinated package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for manifest in \
            packages/integrations/package.json \
            packages/contracts/package.json \
            packages/observability/package.json \
            packages/core/gateway/package.json \
            packages/core/api/package.json \
            apps/ts/package.json \
            apps/local/package.json \
            apps/cli/package.json
          do
            jq -er --arg version "$version" '.version == $version' "$manifest" >/dev/null
          done
          grep -F "gatewayVersion = \"$version\"" packages/core/api/src/version.ts >/dev/null

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Prepare version-pinned installer
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/release"
          sed "s/^default_ref=.*/default_ref=\"$RELEASE_TAG\"/" install.sh > "${{ runner.temp }}/release/install.sh"
          chmod +x "${{ runner.temp }}/release/install.sh"
          sh -n "${{ runner.temp }}/release/install.sh"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" "${{ runner.temp }}/release/install.sh" --generate-notes --verify-tag
