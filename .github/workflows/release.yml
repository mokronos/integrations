name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Verify coordinated package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for manifest in \
            packages/integrations/package.json \
            packages/contracts/package.json \
            packages/observability/package.json \
            packages/core/gateway/package.json \
            packages/core/api/package.json \
            apps/ts/package.json \
            apps/local/package.json \
            apps/cli/package.json
          do
            jq -er --arg version "$version" '.version == $version' "$manifest" >/dev/null
          done
          grep -F "gatewayVersion = \"$version\"" packages/core/api/src/version.ts >/dev/null

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - asset: integrations-linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
          - asset: integrations-linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - asset: integrations-darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64
          - asset: integrations-darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
      - name: Build standalone executable
        run: |
          mkdir -p "${{ runner.temp }}/archive"
          bun run release:build \
            --target "${{ matrix.target }}" \
            --outfile "${{ runner.temp }}/archive/integrations"
      - name: Smoke-test executable
        run: |
          set -euo pipefail
          ln -s "${{ runner.temp }}/archive/integrations" "${{ runner.temp }}/i"
          ln -s "${{ runner.temp }}/archive/integrations" "${{ runner.temp }}/ii"
          "${{ runner.temp }}/i" --help >/dev/null
          "${{ runner.temp }}/ii" --help >/dev/null
          test_home="${{ runner.temp }}/smoke-home"
          INTEGRATIONS_HOME="$test_home" "${{ runner.temp }}/ii" serve --port 24788 >"${{ runner.temp }}/gateway.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT
          attempt=0
          while [ "$attempt" -lt 40 ]; do
            if curl -fsS http://127.0.0.1:24788/ | grep -q '<div id="root">'; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 0.25
          done
          if [ "$attempt" -lt 40 ]; then
            exit 0
          fi
          cat "${{ runner.temp }}/gateway.log"
          exit 1
      - name: Package executable
        run: tar -C "${{ runner.temp }}/archive" -czf "${{ runner.temp }}/${{ matrix.asset }}.tar.gz" integrations
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integrations-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Prepare version-pinned installer
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sed "s/^default_version=.*/default_version=\"$RELEASE_TAG\"/" install.sh > "${{ runner.temp }}/release/install.sh"
          chmod +x "${{ runner.temp }}/release/install.sh"
          sh -n "${{ runner.temp }}/release/install.sh"
          cd "${{ runner.temp }}/release"
          sha256sum integrations-*.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" "${{ runner.temp }}/release/"* --generate-notes --verify-tag
