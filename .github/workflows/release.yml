name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  schedule:
    # Nightly, away from the top of the hour where scheduled jobs pile up.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options: [nightly, stable]
      tag:
        description: Existing vX.Y.Z tag to release (stable only)
        required: false
        type: string

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: meta
        name: Resolve release version
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.channel }}" == "nightly" ) ]]; then
            bun run scripts/release-version.ts resolve \
              --channel nightly \
              --date "$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)" \
              --run-number "$RUN_NUMBER" \
              --sha "$GITHUB_SHA"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            bun run scripts/release-version.ts resolve \
              --channel stable \
              --version "${DISPATCH_TAG:-$GITHUB_REF_NAME}"
            echo "ref=${DISPATCH_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      # A stable tag must already carry its version in the manifests. A nightly
      # is cut from an unstamped `main`, so the version is applied at build time
      # and never committed back.
      - name: Verify coordinated package versions
        if: needs.preflight.outputs.channel == 'stable'
        run: bun run scripts/release-version.ts verify --version "${{ needs.preflight.outputs.version }}"

  packages:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Stamp release version
        run: bun run scripts/release-version.ts apply --version "${{ needs.preflight.outputs.version }}"
      # Each package's `prepack` builds only itself, so the dependency order is
      # established up front: gateway-core compiles against the host's and the
      # contracts' emitted types.
      - run: bun run build:gateway
      - name: Pack publishable packages
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/packages"
          mapfile -t directories < <(bun run scripts/release-version.ts packages)
          for directory in "${directories[@]}"; do
            (cd "$directory" && bun pm pack --destination "${{ runner.temp }}/packages")
          done
          ls -1 "${{ runner.temp }}/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  build:
    needs: [preflight, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - asset: integrations-linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
          - asset: integrations-linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - asset: integrations-darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64
          - asset: integrations-darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Stamp release version
        run: bun run scripts/release-version.ts apply --version "${{ needs.preflight.outputs.version }}"
      - run: bun run build:control-plane
      - name: Build standalone executable
        run: |
          mkdir -p "${{ runner.temp }}/archive"
          bun run release:build \
            --target "${{ matrix.target }}" \
            --outfile "${{ runner.temp }}/archive/integrations"
      - name: Smoke-test executable
        run: |
          set -euo pipefail
          ln -s "${{ runner.temp }}/archive/integrations" "${{ runner.temp }}/i"
          ln -s "${{ runner.temp }}/archive/integrations" "${{ runner.temp }}/ii"
          "${{ runner.temp }}/i" --help >/dev/null
          "${{ runner.temp }}/ii" --help >/dev/null
          test_home="${{ runner.temp }}/smoke-home"
          INTEGRATIONS_HOME="$test_home" "${{ runner.temp }}/ii" serve --port 24788 >"${{ runner.temp }}/gateway.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT
          attempt=0
          while [ "$attempt" -lt 40 ]; do
            if curl -fsS http://127.0.0.1:24788/ | grep -q '<div id="root">'; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 0.25
          done
          if [ "$attempt" -lt 40 ]; then
            exit 0
          fi
          cat "${{ runner.temp }}/gateway.log"
          exit 1
      - name: Package executable
        run: tar -C "${{ runner.temp }}/archive" -czf "${{ runner.temp }}/${{ matrix.asset }}.tar.gz" integrations
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: [preflight, build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integrations-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/release
      - name: Prepare version-pinned installer
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          sed "s/^default_version=.*/default_version=\"$RELEASE_TAG\"/" install.sh > "${{ runner.temp }}/release/install.sh"
          chmod +x "${{ runner.temp }}/release/install.sh"
          sh -n "${{ runner.temp }}/release/install.sh"
          cd "${{ runner.temp }}/release"
          sha256sum integrations-*.tar.gz > SHA256SUMS
          sha256sum mokronos-*.tgz > PACKAGES-SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_NAME: ${{ needs.preflight.outputs.name }}
        run: |
          set -euo pipefail
          args=(--title "$RELEASE_NAME" --generate-notes --target "${{ needs.preflight.outputs.ref }}")
          if [[ "${{ needs.preflight.outputs.is_prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "${{ needs.preflight.outputs.make_latest }}" == "true" ]]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi
          if [[ "${{ needs.preflight.outputs.channel }}" == "stable" ]]; then
            args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "${{ runner.temp }}/release/"* "${args[@]}"
