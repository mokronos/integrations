name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Verify coordinated package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for manifest in \
            packages/integrations-executor/package.json \
            packages/integrations-protocol/package.json \
            packages/observability/package.json \
            apps/integrations/ts/package.json \
            apps/integrations/gateway/package.json \
            apps/integrations/cli/package.json
          do
            jq -er --arg version "$version" '.version == $version' "$manifest" >/dev/null
          done
          grep -F "gatewayVersion = \"$version\"" apps/integrations/gateway/src/version.ts >/dev/null

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: mkdir -p ${{ runner.temp }}/release
      - run: bun pm pack --ignore-scripts --destination ${{ runner.temp }}/release --filename protocol.tgz
        working-directory: packages/integrations-protocol
      - run: bun pm pack --ignore-scripts --destination ${{ runner.temp }}/release --filename executor.tgz
        working-directory: packages/integrations-executor
      - run: bun pm pack --ignore-scripts --destination ${{ runner.temp }}/release --filename observability.tgz
        working-directory: packages/observability
      - run: bun pm pack --ignore-scripts --destination ${{ runner.temp }}/release --filename client.tgz
        working-directory: apps/integrations/ts
      - run: bun pm pack --ignore-scripts --destination ${{ runner.temp }}/release --filename gateway.tgz
        working-directory: apps/integrations/gateway
      - run: bun pm pack --ignore-scripts --destination ${{ runner.temp }}/release --filename cli.tgz
        working-directory: apps/integrations/cli
      - run: npm publish ${{ runner.temp }}/release/protocol.tgz --provenance --access public
      - run: npm publish ${{ runner.temp }}/release/executor.tgz --provenance --access public
      - run: npm publish ${{ runner.temp }}/release/observability.tgz --provenance --access public
      - run: npm publish ${{ runner.temp }}/release/client.tgz --provenance --access public
      - run: npm publish ${{ runner.temp }}/release/gateway.tgz --provenance --access public
      - run: npm publish ${{ runner.temp }}/release/cli.tgz --provenance --access public
      - name: Verify the registry install
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          directory="$(mktemp -d)"
          cd "$directory"
          bun init -y
          bun add "@mokronos/integrations-cli@$version"
          test -x node_modules/.bin/i
          test -x node_modules/.bin/ii
          test ! -e node_modules/.bin/integrations
          node_modules/.bin/i --help >/dev/null
          node_modules/.bin/ii --help >/dev/null
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag
